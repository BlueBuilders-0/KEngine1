<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KEngine1</title>
<style>
  :root{
    --bg:#383838;
    --bg-dark:#282828;
    --bg-darker:#1e1e1e;
    --header:#3c3c3c;
    --tab:#3c3c3c;
    --tab-active:#4a4a4a;
    --line:#232323;
    --line2:#1c1c1c;
    --txt:#d4d4d4;
    --dim:#8c8c8c;
    --accent:#3d7ebd;
    --accent-h:#4a90d9;
    --play:#4a8a3c;
    --play-h:#5aa04a;
    --selected:#2c5d87;
    --input:#2d2d2d;
    --warn:#d6a84a;
    --danger:#b04a4a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg-darker);color:var(--txt);
    font:11px/1.4 "Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  button{font:inherit;color:var(--txt);background:var(--tab);border:1px solid var(--line);
    border-radius:2px;padding:4px 9px;cursor:pointer}
  button:hover{background:var(--tab-active);border-color:#555}
  button:active{background:#2c2c2c}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:var(--accent-h);border-color:var(--accent-h)}
  button.good{background:var(--play);border-color:#3d7330;color:#fff}
  button.good:hover{background:var(--play-h);border-color:var(--play-h)}
  button.bad{background:#5a2a2a;border-color:#7a3a3a;color:#ff9aa4}
  button.bad:hover{background:#6e3333}
  button:disabled{opacity:.4;cursor:default;background:var(--tab)}
  input,select,textarea{font:inherit;color:var(--txt);background:var(--input);
    border:1px solid var(--line2);border-radius:2px;padding:3px 6px;width:100%}
  input:focus,select:focus,textarea:focus{outline:1px solid var(--accent);border-color:var(--accent)}
  textarea{resize:vertical;font-family:Consolas,Monaco,monospace;font-size:11px;line-height:1.45}
  .screen{position:fixed;inset:0}
  .hidden{display:none !important}
  .spacer{flex:1}

  #menu{background:linear-gradient(180deg,#2a2a2a,#1e1e1e);display:flex;align-items:center;justify-content:center;z-index:50}
  .menu-box{width:560px;max-height:88vh;overflow:auto;background:#2d2d2d;border:1px solid #1a1a1a;
    border-radius:4px;padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .menu-box h1{margin:0;font-size:30px;letter-spacing:1px;font-weight:600;color:#eaeaea}
  .menu-box h1 span{color:var(--accent-h)}
  .menu-box .sub{color:var(--dim);margin:4px 0 18px;font-size:12px}
  .menu-box button{width:100%;margin-bottom:6px;padding:9px;font-size:12px}
  .proj{border:1px solid var(--line2);border-radius:2px;padding:7px 9px;margin-bottom:4px;
    display:flex;align-items:center;gap:8px;background:#252525}
  .proj:hover{background:#2c2c2c}
  .proj .nm{flex:1;cursor:pointer}
  .proj .nm:hover{color:var(--accent-h)}
  .proj small{color:var(--dim);display:block;font-size:10px;margin-top:2px}

  #editor{display:flex;flex-direction:column;z-index:10;background:var(--bg)}
  #topbar{display:flex;align-items:center;gap:4px;padding:4px 6px;background:var(--header);
    border-bottom:1px solid var(--line2);flex-wrap:nowrap;height:32px}
  #topbar .logo{font-weight:700;letter-spacing:1px;color:var(--accent-h);margin-right:8px;font-size:12px}
  #topbar button{padding:4px 10px;font-size:11px;height:24px;line-height:1}
  #topbar .playgroup{display:flex;gap:0;margin:0 8px}
  #topbar .playgroup button{border-radius:0;border-right:0}
  #topbar .playgroup button:first-child{border-radius:2px 0 0 2px}
  #topbar .playgroup button:last-child{border-radius:0 2px 2px 0;border-right:1px solid var(--line)}
  #topbar .playgroup button.good{min-width:44px;font-weight:700}
  #projectName{width:170px;height:22px;padding:2px 6px;font-size:11px}

  #body{flex:1;display:flex;min-height:0}
  #left{width:260px;flex:0 0 260px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;min-width:0}
  #center{flex:1 1 0;display:flex;flex-direction:column;min-width:0;background:var(--bg-darker)}
  #right{width:320px;flex:0 0 320px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;min-width:0}
  .splitter{flex:0 0 4px;background:var(--line2);cursor:col-resize;position:relative;z-index:5;
    transition:background .12s}
  .splitter:hover,.splitter.dragging{background:var(--accent-h)}
  .splitter::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:2px;height:30px;background:#5a5a5a;border-radius:1px;pointer-events:none}
  .splitter:hover::after,.splitter.dragging::after{background:#eaeaea}

  .tabs{display:flex;border-bottom:1px solid var(--line2);background:var(--header);flex-wrap:wrap;min-height:26px}
  .tab{flex:1;border:0;border-radius:0;background:transparent;color:var(--dim);padding:5px 4px;
    font-size:11px;min-width:56px;height:26px;line-height:1}
  .tab:hover{background:var(--tab);color:var(--txt)}
  .tab.active{color:#fff;background:var(--bg);box-shadow:inset 0 -2px 0 var(--accent-h)}
  .tabpane{flex:1;overflow:auto;padding:6px;min-height:0}
  .tabpane.slim{padding:0}

  #viewport{flex:1;position:relative;min-height:0;background:#1e1e1e}
  #gl{display:block;width:100%;height:100%}
  #uilayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  #uilayer .ui-el{position:absolute;pointer-events:auto}
  #hud{position:absolute;left:6px;top:6px;display:flex;gap:3px;flex-wrap:wrap;max-width:calc(100% - 12px);
    background:rgba(40,40,40,.85);border:1px solid var(--line2);border-radius:2px;padding:3px;
    cursor:move;user-select:none;z-index:3}
  #hud.dragging{cursor:grabbing}
  #hud button{padding:2px 7px;font-size:10px;height:20px;border-radius:2px;cursor:pointer}
  #stats{position:absolute;right:6px;top:6px;color:var(--dim);font-size:10px;text-align:right;
    background:rgba(30,30,30,.85);padding:2px 6px;border-radius:2px;border:1px solid var(--line2)}

  #sceneHeader{display:flex;align-items:center;gap:0;background:var(--header);
    border-bottom:1px solid var(--line2);height:26px}
  #sceneHeader .tab{flex:0 0 auto;padding:5px 14px;border-radius:0;box-shadow:none;background:var(--header)}
  #sceneHeader .tab.active{background:var(--bg-darker);box-shadow:inset 0 -2px 0 var(--accent-h);color:#fff}
  #sceneHeader .path{margin-left:auto;color:var(--dim);font-size:10px;padding-right:8px}

  .row{display:flex;gap:5px;align-items:center;margin-bottom:5px}
  .row > *{min-width:0}
  .row label{color:var(--dim);font-size:11px;flex:0 0 76px}
  .row input[type=checkbox]{width:auto;accent-color:var(--accent-h)}

  .sec{border:1px solid var(--line2);border-radius:2px;margin-bottom:6px;background:#2d2d2d;overflow:hidden}
  .sec > h4{margin:0;padding:5px 8px;background:var(--header);font-size:10px;letter-spacing:.6px;
    color:#c8c8c8;text-transform:uppercase;border-bottom:1px solid var(--line2);cursor:pointer;user-select:none;
    display:flex;align-items:center;gap:5px}
  .sec > h4::before{content:"\25BE";color:var(--dim);font-size:9px;transition:transform .12s}
  .sec.collapsed > h4::before{transform:rotate(-90deg)}
  .sec.collapsed > .inner{display:none}
  .sec > .inner{padding:7px 8px}

  .tree{list-style:none;margin:0;padding:0;font-size:11px}
  .tree li{padding:2px 6px;cursor:pointer;display:flex;align-items:center;gap:6px;border-radius:2px;line-height:20px}
  .tree li:hover{background:#2f2f2f}
  .tree li.sel{background:var(--selected);color:#fff}
  .tree li .tag{color:var(--dim);font-size:9px;border:1px solid var(--line2);border-radius:2px;
    padding:0 4px;line-height:14px}
  .tree li .eye{margin-left:auto;color:var(--dim);font-size:10px;padding-left:6px}
  .tree li .player{color:#7ee0a8;font-size:9px;font-weight:700}

  .card{border:1px solid var(--line2);border-radius:2px;padding:6px 7px;margin-bottom:4px;
    background:#2d2d2d;cursor:pointer}
  .card:hover{border-color:var(--accent);background:#333}
  .card b{display:block;font-size:11px;color:#eaeaea}
  .card small{color:var(--dim);font-size:10px}

  .rule{border:1px solid var(--line2);border-radius:2px;padding:6px;margin-bottom:5px;background:#2d2d2d}
  .rule .hd{display:flex;align-items:center;gap:5px;margin-bottom:5px}
  .rule .hd b{font-size:10px;color:var(--warn);flex:1;letter-spacing:.5px;text-transform:uppercase}
  .rule select,.rule input{margin-bottom:3px}

  .mission{border:1px solid var(--line2);border-radius:2px;padding:7px;margin-bottom:5px;background:#2d2d2d}
  .mission .hd{display:flex;align-items:center;gap:5px;margin-bottom:5px}
  .mission .hd b{font-size:11px;color:#7ee0a8;flex:1}

  #modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:80;display:flex;
    align-items:center;justify-content:center;padding:24px}
  #modal .box{width:min(1000px,96vw);height:min(760px,92vh);display:flex;flex-direction:column;
    background:var(--bg);border:1px solid var(--line2);border-radius:3px;overflow:hidden}
  #modal .box header{display:flex;align-items:center;gap:6px;padding:8px 10px;
    border-bottom:1px solid var(--line2);background:var(--header)}
  #modal .box header b{flex:1;font-size:12px}
  #modal .box .content{flex:1;overflow:auto;padding:10px}
  #exportCode{width:100%;height:100%;min-height:420px}

  .hint{color:var(--dim);font-size:10px;margin:3px 0;line-height:1.35}
  #statusbar{height:22px;background:var(--header);border-top:1px solid var(--line2);
    display:flex;align-items:center;padding:0 8px;font-size:10px;color:var(--dim);gap:8px}
  #statusbar .dot{color:var(--play)}
  #statusbar .sep{color:#555}

  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#3c3c3c;border-radius:0}
  ::-webkit-scrollbar-thumb:hover{background:#4a4a4a}
  ::-webkit-scrollbar-track{background:#252525}
</style>
</head>
<body>

<div id="menu" class="screen">
  <div class="menu-box">
    <h1>K<span>Engine1</span></h1>
    <p class="sub">Browser 3D game engine. Build, script, test, export.</p>
    <button id="btnNew" class="primary">New Game</button>
    <button id="btnContinue">Continue (last project)</button>
    <div id="projectList"></div>
    <div class="row" style="margin-top:12px">
      <button id="btnImport">Import .keng file</button>
      <button id="btnCloud">Cloud Sync Settings</button>
    </div>
    <input type="file" id="fileImport" accept=".keng,.json" hidden>
    <p class="hint">Projects are stored in the browser IndexedDB database, and can be exported as .keng files or synced to any HTTP endpoint you provide in Cloud Sync Settings.</p>
  </div>
</div>

<div id="editor" class="screen hidden">
  <div id="topbar">
    <span class="logo">KEngine1</span>
    <button data-act="menu">Menu</button>
    <button data-act="save">Save</button>
    <div class="playgroup">
      <button data-act="play" class="good" title="Play / Test">&#9654; Play</button>
      <button data-act="stop" disabled title="Stop">&#9632;</button>
    </div>
    <button data-act="undo">Undo</button>
    <button data-act="redo">Redo</button>
    <button data-act="export" class="primary">Export HTML</button>
    <span class="spacer"></span>
    <input id="projectName" value="Untitled Game">
  </div>

  <div id="body">
    <div id="left">
      <div class="tabs">
        <button class="tab active" data-tab="tree">Hierarchy</button>
        <button class="tab" data-tab="toolbox">Toolbox</button>
      </div>
      <div class="tabpane slim" id="pane-tree"></div>
      <div class="tabpane slim hidden" id="pane-toolbox"></div>
    </div>
    <div class="splitter" data-split="left" title="Drag to resize. Double-click to reset."></div>

    <div id="center">
      <div id="sceneHeader">
        <button class="tab active" data-view="scene">Scene</button>
        <button class="tab" data-view="game">Game</button>
        <span class="path" id="scenePath">SampleScene</span>
      </div>
      <div id="viewport">
        <canvas id="gl"></canvas>
        <div id="uilayer"></div>
        <div id="stats">0 fps</div>
        <div id="hud">
          <button data-tool="translate" title="Move (W)">Move</button>
          <button data-tool="rotate" title="Rotate (E)">Rotate</button>
          <button data-tool="scale" title="Scale (R)">Scale</button>
          <button data-tool="none">Deselect</button>
          <button data-tool="snap">Snap: off</button>
          <button data-tool="grid">Grid: on</button>
          <button data-tool="focus">Focus</button>
          <button data-tool="del">Delete</button>
          <button data-tool="dup">Duplicate</button>
          <button data-tool="third">3rd Person</button>
          <button data-tool="camreset">Cam Reset</button>
        </div>
      </div>
    </div>
    <div class="splitter" data-split="right" title="Drag to resize. Double-click to reset."></div>

    <div id="right">
      <div class="tabs">
        <button class="tab active" data-tab="inspector">Inspector</button>
        <button class="tab" data-tab="logic">Logic</button>
        <button class="tab" data-tab="missions">Missions</button>
        <button class="tab" data-tab="code">Code</button>
        <button class="tab" data-tab="cutscene">Cutscene</button>
        <button class="tab" data-tab="world">World</button>
      </div>
      <div class="tabpane hidden" id="pane-inspector"></div>
      <div class="tabpane hidden" id="pane-logic"></div>
      <div class="tabpane hidden" id="pane-missions"></div>
      <div class="tabpane hidden" id="pane-code"></div>
      <div class="tabpane hidden" id="pane-cutscene"></div>
      <div class="tabpane hidden" id="pane-world"></div>
    </div>
  </div>

  <div id="statusbar">
    <span class="dot">&#9679;</span>
    <span id="statusText">Ready</span>
    <span class="sep">|</span>
    <span id="statusPlayer">No player</span>
    <span class="sep">|</span>
    <span id="statusObjects">0 objects</span>
    <span class="spacer"></span>
    <span id="statusFps">0 fps</span>
  </div>
</div>

<div id="modal" class="hidden">
  <div class="box">
    <header>
      <b id="modalTitle">Output</b>
      <button id="modalCopy">Copy</button>
      <button id="modalDownload">Download</button>
      <button id="modalClose" class="bad">Close</button>
    </header>
    <div class="content" id="modalContent"><textarea id="exportCode" spellcheck="false"></textarea></div>
  </div>
</div>

<script type="importmap">
{

    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

  }
}
</script>

  { n:'Ocean Waves',    u:'https://actions.google.com/sounds/v1/water/waves_crashing_on_rock_beach.ogg' },
  { n:'Cat Purr',       u:'https://actions.google.com/sounds/v1/animals/cat_purr_close.ogg' },
  { n:'Wood Impact',    u:'https://actions.google.com/sounds/v1/impacts/wood_plank_flicks.ogg' },
  { n:'Digital Alarm',  u:'https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg' },
  { n:'Cartoon Boing',  u:'https://actions.google.com/sounds/v1/cartoon/concussive_hit_guitar_boing.ogg' }
];

/* =====================================================================
   SECTION 1 - KENGINE1 RUNTIME
   ===================================================================== */
function KRuntime(THREE, CANNON, deps, opts) {
  opts = opts || {};
  var GLTFLoader = deps.GLTFLoader;
  var RGBELoader = deps.RGBELoader;
  var Sky = deps.Sky;

  var R = {};

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function uid(p) { return (p || 'o') + Math.random().toString(36).slice(2, 9); }
  function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }

  R.scene = new THREE.Scene();
  R.camera = new THREE.PerspectiveCamera(60, 16 / 9, 0.08, 6000);
  R.camera.position.set(0, 2, 8);
  R.objects = [];
  R.byId = {};
  R.byName = {};
  R.vars = {};
  R.handlers = {};
  R.world = null;
  R.bodies = [];
  R.mixers = [];
  R.particles = [];
  R.player = null;
  R.net = null;
  R.netPeers = [];
  R.netRole = 'none';
  R.uiRoot = null;
  R.time = 0;
  R.running = false;
  R.renderer = null;
  R.composer = null;
  R.gltfLoader = new GLTFLoader();
  R.cutscene = null;
  R.gravity = -9.81;
  R.project = null;
  R.audioCtx = null;
  R.buffers = {};
  R.missions = [];
  R.missionState = {};
  R.saveKey = 'default';
  R.settings = {};

  var input = {
    keys: {},
    mouse: { x: 0, y: 0, dx: 0, dy: 0, down: false, locked: false },
    touch: {},
    wheel: 0
  };
  R.input = input;

  function wedge(w, h, d) {
    var g = new THREE.BufferGeometry();
    var x = w / 2, y = h / 2, z = d / 2;
    var v = new Float32Array([
      -x,-y, z,  x,-y, z,  x, y, z, -x,-y, z,  x, y, z, -x, y, z,
      -x,-y,-z, -x, y,-z,  x, y,-z, -x,-y,-z,  x, y,-z,  x,-y,-z,
      -x,-y,-z, -x,-y, z, -x, y, z, -x,-y,-z, -x, y, z, -x, y,-z,
       x,-y,-z,  x, y,-z,  x, y, z,  x,-y,-z,  x, y, z,  x,-y, z,
      -x,-y,-z,  x,-y,-z,  x,-y, z, -x,-y,-z,  x,-y, z, -x,-y, z,
      -x, y, z,  x, y, z,  x, y,-z, -x, y, z,  x, y,-z, -x, y,-z
    ]);
    g.setAttribute('position', new THREE.BufferAttribute(v, 3));
    g.computeVertexNormals();
    return g;
  }

  function textPlane(text, size, color, bg) {
    var c = document.createElement('canvas');
    var ctx = c.getContext('2d');
    var font = 'bold 64px Segoe UI, Arial';
    ctx.font = font;
    var w = Math.max(128, Math.ceil(ctx.measureText(text).width) + 40);
    c.width = w; c.height = 96;
    ctx = c.getContext('2d');
    if (bg && bg !== 'transparent') { ctx.fillStyle = bg; ctx.fillRect(0, 0, c.width, c.height); }
    ctx.font = font; ctx.fillStyle = color || '#ffffff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, c.width / 2, c.height / 2);
    var tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return new THREE.Mesh(
      new THREE.PlaneGeometry(size * (c.width / c.height), size),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false })
    );
  }

  function audio() {
    if (!R.audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) R.audioCtx = new AC();
    }
    if (R.audioCtx && R.audioCtx.state === 'suspended') R.audioCtx.resume();
    return R.audioCtx;
  }

  function synth(kind, volume) {
    var ctx = audio(); if (!ctx) return;
    var t = ctx.currentTime, g = ctx.createGain(), o, o2, buf, src, i;
    volume = volume == null ? 0.5 : volume;
    g.connect(ctx.destination);
    if (kind === 'beep') {
      o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = 880;
      g.gain.setValueAtTime(volume * 0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      o.connect(g); o.start(t); o.stop(t + 0.16);
    } else if (kind === 'coin') {
      o = ctx.createOscillator(); o.type = 'square'; o.frequency.setValueAtTime(988, t);
      o.frequency.setValueAtTime(1319, t + 0.07);
      g.gain.setValueAtTime(volume * 0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o.connect(g); o.start(t); o.stop(t + 0.3);
    } else if (kind === 'jump') {
      o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(720, t + 0.18);
      g.gain.setValueAtTime(volume * 0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      o.connect(g); o.start(t); o.stop(t + 0.23);
    } else if (kind === 'laser') {
      o = ctx.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(1400, t); o.frequency.exponentialRampToValueAtTime(180, t + 0.25);
      g.gain.setValueAtTime(volume * 0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
      o.connect(g); o.start(t); o.stop(t + 0.27);
    } else if (kind === 'explosion') {
      buf = ctx.createBuffer(1, ctx.sampleRate * 1.2, ctx.sampleRate);
      var d = buf.getChannelData(0);
      for (i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.2);
      src = ctx.createBufferSource(); src.buffer = buf;
      var f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
      g.gain.value = volume * 0.7;
      src.connect(f); f.connect(g); src.start(t);
    } else if (kind === 'footstep') {
      buf = ctx.createBuffer(1, ctx.sampleRate * 0.12, ctx.sampleRate);
      var dd = buf.getChannelData(0);
      for (i = 0; i < dd.length; i++) dd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / dd.length, 5);
      src = ctx.createBufferSource(); src.buffer = buf;
      g.gain.value = volume * 0.4; src.connect(g); src.start(t);
    } else if (kind === 'click') {
      buf = ctx.createBuffer(1, ctx.sampleRate * 0.03, ctx.sampleRate);
      var d2 = buf.getChannelData(0);
      for (i = 0; i < d2.length; i++) d2[i] = (Math.random() * 2 - 1) * (1 - i / d2.length);
      src = ctx.createBufferSource(); src.buffer = buf;
      g.gain.value = volume * 0.5; src.connect(g); src.start(t);
    } else if (kind === 'whoosh') {
      buf = ctx.createBuffer(1, ctx.sampleRate * 0.6, ctx.sampleRate);
      var d3 = buf.getChannelData(0);
      for (i = 0; i < d3.length; i++) d3[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / d3.length);
      src = ctx.createBufferSource(); src.buffer = buf;
      var fl = ctx.createBiquadFilter(); fl.type = 'bandpass';
      fl.frequency.setValueAtTime(300, t); fl.frequency.exponentialRampToValueAtTime(2600, t + 0.5);
      g.gain.value = volume * 0.4; src.connect(fl); fl.connect(g); src.start(t);
    } else if (kind === 'powerup') {
      o = ctx.createOscillator(); o.type = 'triangle';
      for (i = 0; i < 6; i++) o.frequency.setValueAtTime(330 * Math.pow(1.26, i), t + i * 0.06);
      g.gain.setValueAtTime(volume * 0.28, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      o.connect(g); o.start(t); o.stop(t + 0.5);
    } else {
      o = ctx.createOscillator(); o2 = ctx.createOscillator();
      o.type = 'sine'; o2.type = 'sine';
      o.frequency.value = 110; o2.frequency.value = 164.8;
      var g2 = ctx.createGain(); g2.gain.value = volume * 0.12;
      o.connect(g2); o2.connect(g2); g2.connect(g);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(volume * 0.25, t + 0.8);
      o.start(t); o2.start(t); o.stop(t + 4); o2.stop(t + 4);
    }
  }

  function playSound(def, rec) {
    if (!def) return;
    var vol = def.volume == null ? 0.6 : def.volume;
    if (def.synth) { synth(def.synth, vol); return; }
    if (!def.src) return;
    var ctx = audio(); if (!ctx) return;
    if (R.buffers[def.src]) {
      var s = ctx.createBufferSource(); s.buffer = R.buffers[def.src];
      var gg = ctx.createGain(); gg.gain.value = vol;
      s.connect(gg);
      if (def.positional && rec && rec.obj && R.camera) {
        var p = new THREE.Vector3(); rec.obj.getWorldPosition(p);
        var pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
        if (pan) { pan.pan.value = clamp(p.x / 20, -1, 1); gg.connect(pan); pan.connect(ctx.destination); }
        else gg.connect(ctx.destination);
      } else gg.connect(ctx.destination);
      s.start(0);
      return;
    }
    fetch(def.src).then(function (r) { return r.arrayBuffer(); }).then(function (b) {
      return ctx.decodeAudioData(b);
    }).then(function (buf) {
      R.buffers[def.src] = buf;
      playSound(def, rec);
    }).catch(function () { synth('beep', vol); });
  }
  R.playSound = playSound;
  R.synth = synth;

  function on(evt, rec, fn) {
    if (!R.handlers[evt]) R.handlers[evt] = [];
    R.handlers[evt].push({ rec: rec, fn: fn });
  }
  function fire(evt, rec, data) {
    var list = R.handlers[evt];
    if (!list) return;
    for (var i = 0; i < list.length; i++) {
      var h = list[i];
      if (h.rec === rec || h.rec === null || h.rec === undefined) {
        try { h.fn(data || {}, rec ? rec.api : null); }
        catch (e) { console.warn('KEngine1 script error [' + evt + ']', e); }
      }
    }
  }
  R.on = on; R.fire = fire;

  function saveKey() { return 'kengine1_save_' + (R.saveKey || 'default'); }

  R.saveState = function () {
    var data = {
      vars: R.vars,
      missions: R.missionState,
      playerPos: R.player && R.player.obj ? R.player.obj.position.toArray() : null,
      time: Date.now()
    };
    try { localStorage.setItem(saveKey(), JSON.stringify(data)); } catch (e) {}
    fire('gameSaved', null, data);
    return data;
  };

  R.loadState = function () {
    try {
      var raw = localStorage.getItem(saveKey());
      if (!raw) return false;
      var data = JSON.parse(raw);
      if (data.vars) R.vars = data.vars;
      if (data.missions) R.missionState = data.missions;
      if (data.playerPos && R.player && R.player.obj) {
        R.player.obj.position.fromArray(data.playerPos);
        if (R.player.body) R.player.body.position.set(data.playerPos[0], data.playerPos[1] + 1, data.playerPos[2]);
      }
      fire('gameLoaded', null, data);
      return true;
    } catch (e) { return false; }
  };

  R.hasSave = function () {
    try { return !!localStorage.getItem(saveKey()); } catch (e) { return false; }
  };

  R.deleteSave = function () {
    try { localStorage.removeItem(saveKey()); } catch (e) {}
    fire('saveDeleted', null, {});
  };

  R.completeMission = function (name) {
    if (!name) return;
    R.missionState[name] = { completed: true, time: Date.now() };
    var mission = null;
    for (var i = 0; i < R.missions.length; i++) if (R.missions[i].name === name || R.missions[i].id === name) mission = R.missions[i];
    var shouldSave = !mission || mission.autoSave !== false;
    if (shouldSave) R.saveState();
    fire('missionComplete', null, { name: name, mission: mission });
    console.log('[KEngine1] Mission complete:', name);
  };

  R.isMissionComplete = function (name) {
    return !!(R.missionState[name] && R.missionState[name].completed);
  };

  R.resetMissions = function () {
    R.missionState = {};
    R.saveState();
    fire('missionsReset', null, {});
  };

  R.getMissionProgress = function () {
    var total = R.missions.length;
    var done = 0;
    for (var i = 0; i < R.missions.length; i++) if (R.isMissionComplete(R.missions[i].name)) done++;
    return { done: done, total: total, percent: total ? Math.round(done / total * 100) : 0 };
  };

  function materialFor(p) {
    p = p || {};
    var col = new THREE.Color(p.color || '#9aa4b2');
    var mt = p.material || 'standard';
    var opts = { color: col, transparent: (p.opacity != null && p.opacity < 1), opacity: p.opacity == null ? 1 : p.opacity };
    var m;
    if (mt === 'basic') m = new THREE.MeshBasicMaterial(opts);
    else if (mt === 'wireframe') { m = new THREE.MeshBasicMaterial(opts); m.wireframe = true; }
    else if (mt === 'phong') { m = new THREE.MeshPhongMaterial(opts); m.shininess = p.roughness != null ? (1 - p.roughness) * 100 : 30; }
    else if (mt === 'glass') {
      m = new THREE.MeshPhysicalMaterial(Object.assign(opts, { roughness: 0.05, metalness: 0, transmission: 0.92, thickness: 0.6, ior: 1.45 }));
      m.transparent = true;
    } else if (mt === 'neon') {
      m = new THREE.MeshStandardMaterial(opts);
      m.emissive = new THREE.Color(p.emissive || p.color || '#00e5ff');
      m.emissiveIntensity = p.emissiveIntensity == null ? 2.2 : p.emissiveIntensity;
    } else {
      m = new THREE.MeshStandardMaterial(opts);
      m.metalness = p.metalness == null ? 0.1 : p.metalness;
      m.roughness = p.roughness == null ? 0.6 : p.roughness;
      if (p.emissive) { m.emissive = new THREE.Color(p.emissive); m.emissiveIntensity = p.emissiveIntensity || 1; }
    }
    if (p.texture) {
      var tl = new THREE.TextureLoader();
      tl.setCrossOrigin('anonymous');
      m.map = tl.load(p.texture);
      if ('colorSpace' in m.map) m.map.colorSpace = THREE.SRGBColorSpace;
      if (p.textureRepeat) { m.map.wrapS = m.map.wrapT = THREE.RepeatWrapping; m.map.repeat.set(p.textureRepeat, p.textureRepeat); }
    }
    return m;
  }

  function shapeGeometry(type, s) {
    s = s || [1, 1, 1];
    switch (type) {
      case 'sphere': return new THREE.SphereGeometry(0.5, 32, 20);
      case 'cylinder': return new THREE.CylinderGeometry(0.5, 0.5, 1, 32);
      case 'cone': return new THREE.ConeGeometry(0.5, 1, 32);
      case 'torus': return new THREE.TorusGeometry(0.5, 0.18, 18, 48);
      case 'capsule': return new THREE.CapsuleGeometry(0.4, 0.8, 8, 20);
      case 'wedge': return wedge(1, 1, 1);
      case 'plane': { var g = new THREE.PlaneGeometry(1, 1); g.rotateX(-Math.PI / 2); return g; }
      default: return new THREE.BoxGeometry(1, 1, 1);
    }
  }

  function syncBody(rec) {
    if (rec.body && rec.body.type !== CANNON.Body.STATIC) {
      rec.body.position.set(rec.obj.position.x, rec.obj.position.y, rec.obj.position.z);
      rec.body.quaternion.setFromEuler(rec.obj.rotation.x, rec.obj.rotation.y, rec.obj.rotation.z);
    }
  }

  function makeApi(rec) {
    var o = rec.obj;
    return {
      def: rec.def,
      object: o,
      get position() { return o.position; },
      setPosition: function (x, y, z) { o.position.set(x, y, z); syncBody(rec); },
      move: function (x, y, z) { o.position.x += x || 0; o.position.y += y || 0; o.position.z += z || 0; syncBody(rec); },
      rotate: function (x, y, z) { o.rotation.x += x || 0; o.rotation.y += y || 0; o.rotation.z += z || 0; },
      setRotation: function (x, y, z) { o.rotation.set(x || 0, y || 0, z || 0); },
      setScale: function (x, y, z) { o.scale.set(x == null ? 1 : x, y == null ? 1 : y, z == null ? 1 : z); },
      setColor: function (c) {
        o.traverse(function (n) {
          if (n.material && n.material.color) {
            var arr = Array.isArray(n.material) ? n.material : [n.material];
            for (var i = 0; i < arr.length; i++) arr[i].color = new THREE.Color(c);
          }
        });
      },
      setVisible: function (v) { o.visible = !!v; },
      setText: function (t) {
        if (rec.textMesh) {
          var p = rec.textMesh.parent;
          var nm = textPlane(t, rec.def.props.size || 1, rec.def.props.color || '#ffffff', rec.def.props.bg);
          nm.position.copy(rec.textMesh.position);
          p.remove(rec.textMesh); p.add(nm); rec.textMesh = nm;
        }
      },
      playAnimation: function (name) { playClip(rec, name); },
      stopAnimations: function () { if (rec.mixer) rec.mixer.stopAllAction(); },
      lookAt: function (t) { if (t && t.object) o.lookAt(t.object.position); else if (t) o.lookAt(t.x, t.y, t.z); },
      destroy: function () { destroyObject(rec); },
      clone: function () {
        var c = deepCopy(rec.def); c.id = 'o' + Math.random().toString(36).slice(2, 9);
        c.name = rec.def.name + '_copy';
        c.pos = [rec.obj.position.x, rec.obj.position.y, rec.obj.position.z];
        return build(c, rec.obj.parent).api;
      },
      getVar: function (k) { return R.vars[k]; },
      setVar: function (k, v) { R.vars[k] = v; fire('varChange', null, { key: k, value: v }); },
      playSound: function (name) {
        var d = null;
        for (var i = 0; i < R.objects.length; i++) if (R.objects[i].def.name === name) d = R.objects[i].def.props;
        playSound(d || { synth: name }, null);
      },
      find: function (n) { return R.byName[n] ? R.byName[n].api : null; },
      on: function (e, f) { on(e, rec, f); },
      emit: function (e, d) { fire(e, null, d); },
      sendNet: function (d) { sendNet({ t: 'msg', from: rec.def.id, data: d }); },
      completeMission: function (n) { R.completeMission(n || rec.def.name); },
      isMissionComplete: function (n) { return R.isMissionComplete(n); },
      saveGame: function () { return R.saveState(); },
      loadGame: function () { return R.loadState(); },
      setPlayer: function () {
        R.objects.forEach(function (r) { r.def.props.isPlayer = false; });
        rec.def.props.isPlayer = true;
        if (R.player) R.player = null;
        initPlayer(R.settings || {});
      }
    };
  }

  function destroyObject(rec) {
    if (!rec) return;
    if (rec.body && R.world) R.world.removeBody(rec.body);
    if (rec.obj.parent) rec.obj.parent.remove(rec.obj);
    rec.obj.traverse(function (n) {
      if (n.geometry) n.geometry.dispose();
      if (n.material) {
        var a = Array.isArray(n.material) ? n.material : [n.material];
        a.forEach(function (m) { m.dispose(); });
      }
    });
    var i = R.objects.indexOf(rec); if (i >= 0) R.objects.splice(i, 1);
    delete R.byId[rec.def.id];
    if (R.byName[rec.def.name] === rec) delete R.byName[rec.def.name];
    if (rec.uiNode && rec.uiNode.parentNode) rec.uiNode.parentNode.removeChild(rec.uiNode);
  }
  R.destroyObject = destroyObject;

  function playClip(rec, name) {
    if (!rec.mixer || !rec.clips || !rec.clips.length) return;
    var clip = rec.clips.find(function (c) { return c.name === name; }) || rec.clips[0];
    if (!clip) return;
    if (rec.current) rec.current.stop();
    rec.current = rec.mixer.clipAction(clip);
    rec.current.reset().play();
  }
  R.playClip = playClip;

  function build(def, parent) {
    var obj = new THREE.Object3D();
    var props = def.props || (def.props = {});
    var rec = { def: def, obj: obj, body: null, mixer: null, clips: [], current: null, uiNode: null };
    var t = def.type;

    obj.userData.kid = def.id;
    obj.position.fromArray(def.pos || [0, 0, 0]);
    obj.rotation.set((def.rot || [0, 0, 0])[0], (def.rot || [0, 0, 0])[1], (def.rot || [0, 0, 0])[2]);
    obj.scale.fromArray(def.scale || [1, 1, 1]);
    obj.name = def.name;
    obj.visible = def.visible !== false;

    if (t === 'part' || t === 'sphere' || t === 'cylinder' || t === 'cone' ||
        t === 'torus' || t === 'capsule' || t === 'wedge' || t === 'plane') {
      var geo = shapeGeometry(t, def.scale);
      var mesh = new THREE.Mesh(geo, materialFor(props));
      mesh.castShadow = props.castShadow !== false;
      mesh.receiveShadow = props.receiveShadow !== false;
      obj.add(mesh);
      if (t === 'plane') { obj.scale.set(1, 1, 1); }
    } else if (t === 'text') {
      var tm = textPlane(props.text || 'Text', props.size || 1, props.color || '#ffffff', props.bg);
      obj.add(tm); rec.textMesh = tm;
    } else if (t === 'light') {
      var kind = props.light || 'point';
      var L;
      if (kind === 'directional') L = new THREE.DirectionalLight(props.color || '#ffffff', props.intensity == null ? 2 : props.intensity);
      else if (kind === 'spot') {
        L = new THREE.SpotLight(props.color || '#ffffff', props.intensity == null ? 20 : props.intensity);
        L.angle = props.angle == null ? 0.5 : props.angle;
        L.penumbra = props.penumbra == null ? 0.3 : props.penumbra;
      }
      else if (kind === 'ambient') L = new THREE.AmbientLight(props.color || '#ffffff', props.intensity == null ? 0.6 : props.intensity);
      else if (kind === 'hemisphere') L = new THREE.HemisphereLight(props.color || '#ffffff', '#223344', props.intensity == null ? 1 : props.intensity);
      else L = new THREE.PointLight(props.color || '#ffffff', props.intensity == null ? 12 : props.intensity, props.distance || 0, 2);
      if (L.shadow && props.shadows !== false) {
        L.castShadow = true; L.shadow.mapSize.set(1024, 1024);

        if (L.shadow.camera && L.shadow.camera.isOrthographicCamera) {

          cam.pos.z += (desiredZ - cam.pos.z) * a;
          cam.target.x += (lookX - cam.target.x) * a;
          cam.target.y += (lookY - cam.target.y) * a;
          cam.target.z += (lookZ - cam.target.z) * a;
        }
        R.camera.position.copy(cam.pos);
        R.camera.lookAt(cam.target.x, cam.target.y, cam.target.z);
      } else {
        /* first person */
        var eyeY = p.obj.position.y + head * 0.92;
        R.camera.position.set(p.obj.position.x, eyeY, p.obj.position.z);
        var dir = new THREE.Vector3(
          -Math.sin(cam.yaw) * Math.cos(cam.pitch),
          Math.sin(cam.pitch),
          -Math.cos(cam.yaw) * Math.cos(cam.pitch)
        );
        R.camera.lookAt(R.camera.position.x + dir.x, R.camera.position.y + dir.y, R.camera.position.z + dir.z);
      }
    } else {
      /* camera-only player */
      if (p.body) {
        p.body.velocity.x = dx * spd;
        p.body.velocity.z = dz * spd;
        if (p.fly) p.body.velocity.y = ((input.keys['Space'] ? 1 : 0) - (input.keys['ControlLeft'] ? 1 : 0)) * spd;
        else if (input.keys['Space'] && Math.abs(p.body.velocity.y) < 0.6) p.body.velocity.y = p.jump;
        R.camera.position.set(p.body.position.x, p.body.position.y + 0.7, p.body.position.z);
      } else {
        R.camera.position.x += dx * spd * dt;
        R.camera.position.z += dz * spd * dt;
      }
      var dir2 = new THREE.Vector3(
        -Math.sin(cam.yaw) * Math.cos(cam.pitch),
        Math.sin(cam.pitch),
        -Math.cos(cam.yaw) * Math.cos(cam.pitch)
      );
      R.camera.lookAt(R.camera.position.x + dir2.x, R.camera.position.y + dir2.y, R.camera.position.z + dir2.z);
    }
  }

  function sendNet(msg) {
    if (!R.net) return;
    msg.room = R.netRoom;
    try {
      if (R.netRole === 'host') R.netPeers.forEach(function (c) { if (c.open) c.send(msg); });
      else if (R.netConn && R.netConn.open) R.netConn.send(msg);
    } catch (e) {}
  }
  R.sendNet = sendNet;

  function handleNet(msg) {
    if (!msg) return;
    if (msg.t === 'state') {
      for (var id in msg.d) {
        var rec = R.byId[id];
        if (rec && rec !== (R.player && R.player.rec)) {
          rec.obj.position.fromArray(msg.d[id].p);
          rec.obj.quaternion.fromArray(msg.d[id].q);
        }
      }
    } else if (msg.t === 'msg') {
      fire('net', null, msg.data);
      var r = R.byId[msg.from];
      if (r) fire('net', r, msg.data);
    }
  }

  R.startHost = function (roomId, onStatus) {
    if (typeof Peer === 'undefined') { if (onStatus) onStatus('PeerJS not loaded'); return; }
    R.netRoom = roomId; R.netRole = 'host';
    R.net = new Peer('kengine1-' + roomId, { debug: 0 });
    R.net.on('open', function (id) { if (onStatus) onStatus('Hosting: ' + id); });
    R.net.on('connection', function (conn) {
      R.netPeers.push(conn);
      conn.on('data', handleNet);
      conn.on('open', function () {
        var snap = {};
        R.objects.forEach(function (r) { snap[r.def.id] = { p: r.obj.position.toArray(), q: r.obj.quaternion.toArray() }; });
        conn.send({ t: 'state', d: snap });
      });
      if (onStatus) onStatus('Player joined (' + R.netPeers.length + ')');
    });
    R.net.on('error', function (e) { if (onStatus) onStatus('Error: ' + e.type); });
  };

  R.joinHost = function (roomId, onStatus) {
    if (typeof Peer === 'undefined') { if (onStatus) onStatus('PeerJS not loaded'); return; }
    R.netRoom = roomId; R.netRole = 'client';
    R.net = new Peer({ debug: 0 });
    R.net.on('open', function () {
      var conn = R.net.connect('kengine1-' + roomId, { reliable: true });
      R.netConn = conn;
      conn.on('open', function () { if (onStatus) onStatus('Connected to room'); });
      conn.on('data', handleNet);
      conn.on('error', function () { if (onStatus) onStatus('Connection error'); });
    });
    R.net.on('error', function (e) { if (onStatus) onStatus('Error: ' + e.type); });
  };

  var netTick = 0;
  function updateNet(dt) {
    if (!R.net || R.netRole !== 'host') return;
    netTick += dt;
    if (netTick < 1 / 15) return;
    netTick = 0;
    var d = {};
    R.objects.forEach(function (r) {
      if (r.body && r !== (R.player && R.player.rec)) d[r.def.id] = { p: r.obj.position.toArray(), q: r.obj.quaternion.toArray() };
    });
    sendNet({ t: 'state', d: d });
  }

  R.playCutscene = function (name) {
    var cs = null;
    if (!R.project || !R.project.cutscenes) return;
    for (var i = 0; i < R.project.cutscenes.length; i++)
      if (R.project.cutscenes[i].name === name) cs = R.project.cutscenes[i];
    if (!cs) return;
    R.cutscene = { data: cs, t: 0, cam: null };
    if (cs.cameraId && R.byName[cs.cameraId]) R.cutscene.cam = R.byName[cs.cameraId].obj;
  };

  function updateCutscene(dt) {
    var c = R.cutscene;
    if (!c) return;
    c.t += dt;
    var cs = c.data;
    for (var i = 0; i < cs.tracks.length; i++) {
      var tr = cs.tracks[i];
      var rec = R.byId[tr.id];
      if (!rec) continue;
      var keys = tr.keys;
      if (!keys.length) continue;
      var k0 = keys[0], k1 = keys[keys.length - 1];
      for (var k = 0; k < keys.length - 1; k++) {
        if (c.t >= keys[k].t && c.t <= keys[k + 1].t) { k0 = keys[k]; k1 = keys[k + 1]; break; }
      }
      var span = (k1.t - k0.t) || 1;
      var a = clamp((c.t - k0.t) / span, 0, 1);
      a = a * a * (3 - 2 * a);
      rec.obj.position.set(
        k0.p[0] + (k1.p[0] - k0.p[0]) * a,
        k0.p[1] + (k1.p[1] - k0.p[1]) * a,
        k0.p[2] + (k1.p[2] - k0.p[2]) * a
      );
      rec.obj.rotation.set(
        k0.r[0] + (k1.r[0] - k0.r[0]) * a,
        k0.r[1] + (k1.r[1] - k0.r[1]) * a,
        k0.r[2] + (k1.r[2] - k0.r[2]) * a
      );
    }
    if (c.cam) {
      var w = new THREE.Vector3();
      c.cam.getWorldPosition(w);
      R.camera.position.copy(w);
      var q = new THREE.Quaternion();
      c.cam.getWorldQuaternion(q);
      R.camera.quaternion.copy(q);
    }
    if (c.t > cs.duration) R.cutscene = null;
  }

  var raycaster = new THREE.Raycaster();
  function raycastClick(ev) {
    var rect = ev.target.getBoundingClientRect();
    var nx = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
    var ny = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera({ x: nx, y: ny }, R.camera);
    var hits = raycaster.intersectObjects(R.scene.children, true);
    if (!hits.length) return;
    var n = hits[0].object;
    while (n && !n.userData.kid) n = n.parent;
    if (!n) return;
    var rec = R.byId[n.userData.kid];
    if (rec) fire('click', rec, { point: hits[0].point, ui: false });
  }

  R.bindInput = function (dom, canvas) {
    var lastMX = 0, lastMY = 0;
    window.addEventListener('keydown', function (e) {
      input.keys[e.code] = true;
      fire('key', null, { code: e.code, key: e.key });
      if (e.code === 'Space') e.preventDefault();
    });
    window.addEventListener('keyup', function (e) { input.keys[e.code] = false; });

    dom.addEventListener('mousemove', function (e) {
      var mx = e.clientX, my = e.clientY;
      if (input.mouse.locked) {
        input.mouse.dx += e.movementX || 0;
        input.mouse.dy += e.movementY || 0;
      } else {
        input.mouse.dx += mx - lastMX;
        input.mouse.dy += my - lastMY;
      }
      lastMX = mx; lastMY = my;
      input.mouse.x = (mx / window.innerWidth) * 2 - 1;
      input.mouse.y = -(my / window.innerHeight) * 2 + 1;
    });

    dom.addEventListener('mousedown', function (e) {
      if (e.button === 0) input.mouse.down = true;
    });
    window.addEventListener('mouseup', function () { input.mouse.down = false; });
    dom.addEventListener('click', function (e) {
      if (!input.mouse.locked) raycastClick(e);
    });
    dom.addEventListener('contextmenu', function (e) {
      if (input.mouse.locked) e.preventDefault();
    });
    dom.addEventListener('touchstart', function (e) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        input.touch[t.identifier] = { x: t.clientX, y: t.clientY };
      }
      raycastClick(e.changedTouches[0]);
    }, { passive: true });
    dom.addEventListener('touchend', function (e) {
      for (var i = 0; i < e.changedTouches.length; i++) delete input.touch[e.changedTouches[i].identifier];
    }, { passive: true });
    dom.addEventListener('wheel', function (e) {
      input.wheel = (input.wheel || 0) + (e.deltaY > 0 ? 1 : -1);
      if (input.mouse.locked) e.preventDefault();
    }, { passive: false });

    if (opts.pointerLock !== false && canvas) {
      canvas.addEventListener('click', function () {
        if (R.player && !input.mouse.locked && canvas.requestPointerLock) {
          try { canvas.requestPointerLock(); } catch (e) {}
        }
      });
      document.addEventListener('pointerlockchange', function () {
        input.mouse.locked = document.pointerLockElement === canvas;
      });
    }
  };

  var KAPI = {
    get scene() { return R.scene; },
    get camera() { return R.camera; },
    get time() { return R.time; },
    get vars() { return R.vars; },
    get missions() { return R.missions; },
    get missionState() { return R.missionState; },
    get player() { return R.player; },
    find: function (n) { return R.byName[n] ? R.byName[n].api : null; },
    all: function () { return R.objects.map(function (r) { return r.api; }); },
    spawn: function (def) { return build(def, R.scene).api; },
    spawnType: function (type, name, pos) {
      var d = {
        id: uid('o'), name: name || type, type: type,
        pos: pos || [0, 1, 0], rot: [0, 0, 0], scale: [1, 1, 1],
        props: { color: '#9aa4b2' }, rules: [], script: ''
      };
      return build(d, R.scene).api;
    },
    destroy: function (api) { if (api) destroyObject(R.byId[api.def.id]); },
    on: function (e, f) { on(e, null, f); },
    emit: function (e, d) { fire(e, null, d); },
    getVar: function (k) { return R.vars[k]; },
    setVar: function (k, v) { R.vars[k] = v; fire('varChange', null, { key: k }); },
    sound: playSound,
    synth: synth,
    playCutscene: R.playCutscene,
    sendNet: sendNet,
    completeMission: function (n) { R.completeMission(n); },
    isMissionComplete: function (n) { return R.isMissionComplete(n); },
    saveGame: function () { return R.saveState(); },
    loadGame: function () { return R.loadState(); },
    hasSave: function () { return R.hasSave(); },
    deleteSave: function () { return R.deleteSave(); },
    resetMissions: function () { return R.resetMissions(); },
    missionProgress: function () { return R.getMissionProgress(); },
    setPlayer: function (name) {
      R.objects.forEach(function (r) { r.def.props.isPlayer = false; });
      var t = R.byName[name];
      if (t) { t.def.props.isPlayer = true; R.player = null; initPlayer(R.settings || {}); }
    },
    setThirdPerson: function (v) {
      if (R.player) {
        R.player.thirdPerson = !!v;
        R.player.cam.initialized = false;
        fire('cameraMode', null, { thirdPerson: R.player.thirdPerson });
      }
    },
    isThirdPerson: function () { return !!(R.player && R.player.thirdPerson); },
    setCameraDistance: function (d) { if (R.player) R.player.cam.dist = clamp(d, 1.2, 30); },
    setCameraYaw: function (y) { if (R.player) { R.player.cam.yaw = y; R.player.cam.initialized = false; } },
    setCameraPitch: function (p) { if (R.player) { R.player.cam.pitch = clamp(p, -0.85, 1.25); R.player.cam.initialized = false; } },
    setFaceCamera: function (v) { if (R.player) R.player.faceCamera = !!v; },
    resetCamera: function () {
      if (R.player) {
        R.player.cam.initialized = false;
        R.player.cam.yaw = R.player.obj ? R.player.obj.rotation.y : 0;
        R.player.cam.pitch = 0.22;
      }
    },
    log: function () { console.log.apply(console, ['[KEngine1]'].concat(Array.prototype.slice.call(arguments))); },
    THREE: THREE,
    input: input
  };
  R.K = KAPI;

  R.load = function (project, uiRoot) {
    R.project = project;
    R.uiRoot = uiRoot;
    if (uiRoot) uiRoot.innerHTML = '';
    var s = project.settings || {};
    R.settings = s;
    R.gravity = s.gravity == null ? -9.81 : s.gravity;
    R.saveKey = (s.save && s.save.key) || project.name || 'default';
    R.missions = project.missions || [];
    R.missionState = {};

    if (s.save && s.save.autoLoad) {
      try {
        var raw = localStorage.getItem('kengine1_save_' + R.saveKey);
        if (raw) {
          var data = JSON.parse(raw);
          if (data.vars) R.vars = data.vars;
          if (data.missions) R.missionState = data.missions;
        }
      } catch (e) {}
    }

    R.scene.background = new THREE.Color(s.bg || '#0b0e13');
    if (s.fog && s.fog.enabled) {
      R.scene.fog = new THREE.Fog(new THREE.Color(s.fog.color || '#0b0e13'), s.fog.near || 20, s.fog.far || 220);
    }

    initPhysics(s);

    if (s.skybox && s.skybox.type === 'procedural') {
      var sky = new Sky();
      sky.scale.setScalar(10000);
      var u = sky.material.uniforms;
      u.turbidity.value = s.skybox.turbidity == null ? 8 : s.skybox.turbidity;
      u.rayleigh.value = s.skybox.rayleigh == null ? 2 : s.skybox.rayleigh;
      u.mieCoefficient.value = 0.005;
      u.mieDirectionalG.value = 0.8;
      var sun = new THREE.Vector3();
      var phi = THREE.MathUtils.degToRad(90 - (s.skybox.elevation == null ? 45 : s.skybox.elevation));
      var theta = THREE.MathUtils.degToRad(s.skybox.azimuth == null ? 180 : s.skybox.azimuth);
      sun.setFromSphericalCoords(1, phi, theta);
      u.sunPosition.value.copy(sun);
      R.scene.add(sky);
    } else if (s.skybox && s.skybox.type === 'hdr' && s.skybox.url) {
      var rgbe = new RGBELoader();
      rgbe.setCrossOrigin('anonymous');
      rgbe.load(s.skybox.url, function (tex) {
        tex.mapping = THREE.EquirectangularReflectionMapping;
        R.scene.background = tex;
        R.scene.environment = tex;
      }, undefined, function () {});
    } else if (s.skybox && s.skybox.type === 'color') {
      R.scene.background = new THREE.Color(s.skybox.color || '#0b0e13');
    }

    var defs = project.objects || [];
    var map = {};
    defs.filter(function (d) { return !d.parent; }).forEach(function (d) { map[d.id] = build(d, R.scene); });
    defs.filter(function (d) { return d.parent; }).forEach(function (d) {
      var p = map[d.parent];
      map[d.id] = build(d, p ? p.obj : R.scene);
    });

    var hasLight = defs.some(function (d) { return d.type === 'light'; });
    if (!hasLight) {
      var dl = new THREE.DirectionalLight(0xffffff, 2.2);
      dl.position.set(12, 22, 10); dl.castShadow = true;
      dl.shadow.mapSize.set(2048, 2048);
      dl.shadow.camera.near = 0.5; dl.shadow.camera.far = 120;
      dl.shadow.camera.left = -50; dl.shadow.camera.right = 50;
      dl.shadow.camera.top = 50; dl.shadow.camera.bottom = -50;
      dl.shadow.bias = -0.0006;
      R.scene.add(dl);
      R.scene.add(new THREE.HemisphereLight(0xbcd8ff, 0x2a3038, 1.1));
    }

    var camRec = R.objects.find(function (r) { return r.def.type === 'camera' && r.def.props.main; }) ||
                 R.objects.find(function (r) { return r.def.type === 'camera'; });
    if (camRec) {
      var c = null;
      camRec.obj.traverse(function (n) { if (n.isCamera && !c) c = n; });
      if (c) R.camera = c;
    }

    initPlayer(s);
    if (project.vars) R.vars = deepCopy(project.vars);
    R.particles = R.objects.filter(function (r) { return r.particles; });
    return R;
  };

  R.start = function () {
    R.running = true;
    R.time = 0;
    audio();
    fire('start', null, {});
    R.objects.forEach(function (rec) { fire('start', rec, {}); });
    if (R.project && R.project.settings && R.project.settings.autoCutscene) {
      R.playCutscene(R.project.settings.autoCutscene);
    }
  };
  R.stop = function () { R.running = false; };

  R.update = function (dt) {
    if (!R.running) return;
    dt = Math.min(dt, 0.05);
    R.time += dt;
    if (R.player) updatePlayer(dt);

    if (R.handlers['tick']) {
      var list = R.handlers['tick'];
      for (var i = 0; i < list.length; i++) {
        try { list[i].fn({ dt: dt, time: R.time }, list[i].rec ? list[i].rec.api : null); }
        catch (e) { console.warn('KEngine1 tick error', e); }
      }
    }
    for (var m = 0; m < R.mixers.length; m++) if (R.mixers[m].mixer) R.mixers[m].mixer.update(dt);

    for (var p = 0; p < R.particles.length; p++) {
      var rec = R.particles[p], pp = rec.particles;
      if (!rec.obj.visible) continue;
      var arr = pp.points.geometry.attributes.position.array;
      for (var k = 0; k < pp.vel.length; k++) {
        var v = pp.vel[k];
        arr[k * 3] += v.x * dt * pp.speed;
        arr[k * 3 + 1] += v.y * dt * pp.speed;
        arr[k * 3 + 2] += v.z * dt * pp.speed;
        if (arr[k * 3 + 1] > 4) arr[k * 3 + 1] = -4;
      }
      pp.points.geometry.attributes.position.needsUpdate = true;
    }

    stepPhysics(dt);
    updateCutscene(dt);
    updateNet(dt);
    refreshUI();
    input.mouse.dx = 0; input.mouse.dy = 0;
  };

  R.render = function (renderer, w, h) {
    if (R.composer) { if (R.composer.setSize) R.composer.setSize(w, h); R.composer.render(); }
    else renderer.render(R.scene, R.camera);
  };

  R.attachRenderer = function (renderer, w, h) {
    R.renderer = renderer;
    if (R.settings && R.settings.bloom && R.settings.bloom.enabled && deps.EffectComposer) {
      try {
        R.composer = new deps.EffectComposer(renderer);
        R.composer.addPass(new deps.RenderPass(R.scene, R.camera));
        var bp = new deps.UnrealBloomPass(new THREE.Vector2(w, h),
          R.settings.bloom.strength || 0.8, R.settings.bloom.radius || 0.4, R.settings.bloom.threshold || 0.85);
        R.composer.addPass(bp);
      } catch (e) { R.composer = null; }
    }
  };

  R.dispose = function () {
    R.running = false;
    if (R.net) { try { R.net.destroy(); } catch (e) {} R.net = null; }
    R.objects.slice().forEach(function (rec) { destroyObject(rec); });
    R.objects = []; R.byId = {}; R.byName = {}; R.handlers = {};
    if (R.uiRoot) R.uiRoot.innerHTML = '';
  };

  return R;
}

function wedgeGeo(w, h, d) {
  var g = new THREE.BufferGeometry();
  var x = w / 2, y = h / 2, z = d / 2;
  var v = new Float32Array([
    -x,-y, z,  x,-y, z,  x, y, z, -x,-y, z,  x, y, z, -x, y, z,
    -x,-y,-z, -x, y,-z,  x, y,-z, -x,-y,-z,  x, y,-z,  x,-y,-z,
    -x,-y,-z, -x,-y, z, -x, y, z, -x,-y,-z, -x, y, z, -x, y,-z,
     x,-y,-z,  x, y,-z,  x, y, z,  x,-y,-z,  x, y, z,  x,-y, z,
    -x,-y,-z,  x,-y,-z,  x,-y, z, -x,-y,-z,  x,-y, z, -x,-y, z,
    -x, y, z,  x, y, z,  x, y,-z, -x, y, z,  x, y,-z, -x, y,-z
  ]);
  g.setAttribute('position', new THREE.BufferAttribute(v, 3));
  g.computeVertexNormals();
  return g;
}

function makeMaterialForEditor(props) {
  props = props || {};
  var col = new THREE.Color(props.color || '#9aa4b2');
  var mt = props.material || 'standard';
  var opts = { color: col, transparent: (props.opacity != null && props.opacity < 1), opacity: props.opacity == null ? 1 : props.opacity };
  var m;
  if (mt === 'basic') m = new THREE.MeshBasicMaterial(opts);
  else if (mt === 'wireframe') { m = new THREE.MeshBasicMaterial(opts); m.wireframe = true; }
  else if (mt === 'phong') m = new THREE.MeshPhongMaterial(opts);
  else if (mt === 'glass') {
    m = new THREE.MeshPhysicalMaterial(Object.assign(opts, { roughness: 0.05, metalness: 0, transmission: 0.9, thickness: 0.6, ior: 1.45 }));
    m.transparent = true;
  } else if (mt === 'neon') {
    m = new THREE.MeshStandardMaterial(opts);
    m.emissive = new THREE.Color(props.emissive || props.color || '#00e5ff');
    m.emissiveIntensity = props.emissiveIntensity == null ? 2.2 : props.emissiveIntensity;
  } else {
    m = new THREE.MeshStandardMaterial(opts);
    m.metalness = props.metalness == null ? 0.1 : props.metalness;
    m.roughness = props.roughness == null ? 0.6 : props.roughness;
    if (props.emissive) { m.emissive = new THREE.Color(props.emissive); m.emissiveIntensity = props.emissiveIntensity || 1; }
  }
  if (props.texture) {
    var tl = new THREE.TextureLoader();
    tl.setCrossOrigin('anonymous');
    var tx = tl.load(props.texture);
    if ('colorSpace' in tx) tx.colorSpace = THREE.SRGBColorSpace;
    if (props.textureRepeat) { tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(props.textureRepeat, props.textureRepeat); }
    m.map = tx;
  }
  return m;
}

function editorShapeGeo(type) {
  switch (type) {
    case 'sphere': return new THREE.SphereGeometry(0.5, 32, 20);
    case 'cylinder': return new THREE.CylinderGeometry(0.5, 0.5, 1, 32);
    case 'cone': return new THREE.ConeGeometry(0.5, 1, 32);
    case 'torus': return new THREE.TorusGeometry(0.5, 0.18, 18, 48);
    case 'capsule': return new THREE.CapsuleGeometry(0.4, 0.8, 8, 20);
    case 'wedge': return wedgeGeo(1, 1, 1);
    case 'plane': { var g = new THREE.PlaneGeometry(1, 1); g.rotateX(-Math.PI / 2); return g; }
    default: return new THREE.BoxGeometry(1, 1, 1);
  }
}

function buildEditorObject(def, parentObj) {
  var obj = new THREE.Object3D();
  obj.userData.kid = def.id;
  obj.userData.def = def;
  obj.name = def.name;
  obj.position.fromArray(def.pos);
  obj.rotation.set(def.rot[0], def.rot[1], def.rot[2]);
  obj.scale.fromArray(def.scale);
  obj.visible = def.visible !== false;

  var props = def.props || {};
  var t = def.type;

  if (['part', 'sphere', 'cylinder', 'cone', 'torus', 'capsule', 'wedge', 'plane'].indexOf(t) >= 0) {
    var mesh = new THREE.Mesh(editorShapeGeo(t), makeMaterialForEditor(props));
    mesh.castShadow = props.castShadow !== false;
    mesh.receiveShadow = props.receiveShadow !== false;
    obj.add(mesh);
  } else if (t === 'text') {
    obj.add(makeTextPlane(props.text, props.size, props.color, props.bg));
  } else if (t === 'light') {
    var kind = props.light || 'point';
    var L;
    if (kind === 'directional') L = new THREE.DirectionalLight(props.color || '#fff', props.intensity == null ? 2 : props.intensity);
    else if (kind === 'spot') {
      L = new THREE.SpotLight(props.color || '#fff', props.intensity == null ? 20 : props.intensity);
      L.angle = props.angle == null ? 0.5 : props.angle;
      L.penumbra = props.penumbra == null ? 0.3 : props.penumbra;
    }
    else if (kind === 'ambient') L = new THREE.AmbientLight(props.color || '#fff', props.intensity == null ? 0.6 : props.intensity);
    else if (kind === 'hemisphere') L = new THREE.HemisphereLight(props.color || '#fff', '#223344', props.intensity == null ? 1 : props.intensity);
    else L = new THREE.PointLight(props.color || '#fff', props.intensity == null ? 12 : props.intensity, props.distance || 0, 2);
    if (L.shadow && props.shadows !== false) {
      L.castShadow = true; L.shadow.mapSize.set(1024, 1024);
      if (L.shadow.camera && L.shadow.camera.isOrthographicCamera) {
        L.shadow.camera.left = -40; L.shadow.camera.right = 40;
        L.shadow.camera.top = 40; L.shadow.camera.bottom = -40;
      }
      L.shadow.camera.near = 0.5; L.shadow.camera.far = 140;
      L.shadow.bias = -0.0006;
    }
    obj.add(L);
    var giz = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffdd55 }));
    giz.userData.helper = true;
    obj.add(giz);
  } else if (t === 'camera') {
    var cam = new THREE.PerspectiveCamera(props.fov || 60, 16 / 9, props.near || 0.1, props.far || 4000);
    obj.add(cam);
    var camHelper = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.6, 4), new THREE.MeshBasicMaterial({ color: 0x66ccff }));
    camHelper.rotation.x = Math.PI / 2;
    camHelper.userData.helper = true;
    obj.add(camHelper);
  } else if (t === 'particles') {
    var count = props.count || 300;
    var pos = new Float32Array(count * 3);
    var spread = props.spread || 4;
    for (var i = 0; i < count; i++) {
      pos[i * 3] = (Math.random() - 0.5) * spread;
      pos[i * 3 + 1] = (Math.random() - 0.5) * spread;
      pos[i * 3 + 2] = (Math.random() - 0.5) * spread;
    }
    var pg = new THREE.BufferGeometry();
    pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    obj.add(new THREE.Points(pg, new THREE.PointsMaterial({
      color: props.color || '#7fd8ff', size: props.size || 0.09,
      transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending
    })));
  } else if (t === 'sound') {
    var sm = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), new THREE.MeshBasicMaterial({ color: 0x22c98a, wireframe: true }));
    sm.userData.helper = true;
    obj.add(sm);
  } else if (t === 'spawn') {
    var sp = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.08, 20),
      new THREE.MeshBasicMaterial({ color: 0x22c98a, transparent: true, opacity: 0.5 }));
    obj.add(sp);
  } else if (t === 'model' || t === 'character') {
    var holder = new THREE.Group();
    obj.add(holder);
    if (props.url) loadEditorModel(obj, holder, props, t);
  } else if (t.indexOf('ui') === 0) {
    obj.userData.isUI = true;
  }

  if (props.isPlayer) {
    var pm = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12),
      new THREE.MeshBasicMaterial({ color: 0x22c98a, wireframe: true, transparent: true, opacity: 0.85 }));
    pm.userData.helper = true;
    pm.name = '__playerMarker';
    obj.add(pm);
  }

  (parentObj || editorScene).add(obj);
  return obj;
}

function makeTextPlane(text, size, color, bg) {
  text = text == null ? 'Text' : text;
  size = size || 1;
  var c = document.createElement('canvas');
  var ctx = c.getContext('2d');
  var font = 'bold 64px Segoe UI, Arial';
  ctx.font = font;
  var w = Math.max(128, Math.ceil(ctx.measureText(text).width) + 40);
  c.width = w; c.height = 96;
  ctx = c.getContext('2d');
  if (bg && bg !== 'transparent') { ctx.fillStyle = bg; ctx.fillRect(0, 0, c.width, c.height); }
  ctx.font = font;
  ctx.fillStyle = color || '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, c.width / 2, c.height / 2);
  var tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Mesh(
    new THREE.PlaneGeometry(size * (c.width / c.height), size),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false })
  );
}

function loadEditorModel(obj, holder, props, type) {
  editorGltf.load(props.url, function (gltf) {
    var root = gltf.scene;
    root.traverse(function (n) {
      if (n.isMesh) {
        n.castShadow = true;
        n.receiveShadow = true;
        if (n.material && n.material.map && 'colorSpace' in n.material.map) n.material.map.colorSpace = THREE.SRGBColorSpace;
      }
    });
    var box = new THREE.Box3().setFromObject(root);
    var size = new THREE.Vector3();
    box.getSize(size);
    var maxDim = Math.max(size.x, size.y, size.z) || 1;
    if (props.autoscale !== false && maxDim > 4) root.scale.setScalar(2 / maxDim);
    holder.add(root);
    obj.userData.loadedModel = root;
    obj.userData.animations = gltf.animations || [];
    if (state.selected === obj) buildInspector(obj);
  }, undefined, function () {
    var ph = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0xff5f6d, wireframe: true }));
    holder.add(ph);
  });
}

/* =====================================================================
   SECTION 4 - SERIALIZE / DESERIALIZE
   ===================================================================== */
function serializeProject() {
  var objects = [];
  editorScene.traverse(function (o) {
    if (!o.userData || !o.userData.def) return;
    var d = deepCopy(o.userData.def);
    d.pos = o.position.toArray();
    d.rot = [o.rotation.x, o.rotation.y, o.rotation.z];
    d.scale = o.scale.toArray();
    d.visible = o.visible;
    objects.push(d);
  });
  return {
    engine: 'KEngine1',
    version: 2,
    name: state.projectName,
    updated: Date.now(),
    settings: deepCopy(state.settings),
    vars: deepCopy(state.vars),
    missions: deepCopy(state.missions),
    cutscenes: deepCopy(state.cutscenes),
    objects: objects
  };
}

function clearEditorScene() {
  tcontrols.detach();
  state.selected = null;
  var toRemove = [];
  editorScene.traverse(function (o) { if (o.userData && o.userData.def) toRemove.push(o); });
  toRemove.forEach(function (o) {
    o.traverse(function (n) {
      if (n.geometry && n.geometry.dispose) n.geometry.dispose();
      if (n.material) {
        var a = Array.isArray(n.material) ? n.material : [n.material];
        a.forEach(function (m) { if (m.dispose) m.dispose(); });
      }
    });
    if (o.parent) o.parent.remove(o);
  });
}

function applyProject(project) {
  clearEditorScene();
  state.projectName = project.name || 'Untitled Game';
  $('#projectName').value = state.projectName;
  state.settings = Object.assign(deepCopy(state.settings), project.settings || {});
  state.vars = project.vars ? deepCopy(project.vars) : {};
  state.missions = project.missions ? deepCopy(project.missions) : [];
  state.cutscenes = project.cutscenes ? deepCopy(project.cutscenes) : [];

  var defs = project.objects || [];
  var byId = {};
  defs.forEach(function (d) {
    if (!d.parent) byId[d.id] = buildEditorObject(d, editorScene);
  });
  defs.forEach(function (d) {
    if (d.parent) {
      var p = byId[d.parent] || editorScene;
      byId[d.id] = buildEditorObject(d, p);
    }
  });
  refreshTree();
  refreshUILayer();
  buildWorldPanel();
  buildCutscenePanel();
  buildMissionsPanel();
  updateStatusBar();
}

/* =====================================================================
   SECTION 5 - HIERARCHY
   ===================================================================== */
function refreshTree() {
  var pane = $('#pane-tree');
  pane.innerHTML = '';
  var list = el('ul', 'tree');

  function addNode(obj, depth) {
    var def = obj.userData.def;
    var li = el('li');
    li.style.paddingLeft = (6 + depth * 14) + 'px';
    li.dataset.id = def.id;
    if (state.selected === obj) li.classList.add('sel');
    li.appendChild(el('span', null, def.name));
    li.appendChild(el('span', 'tag', def.type));
    if (def.props.isPlayer) li.appendChild(el('span', 'player', 'PLAYER'));
    var eye = el('span', 'eye', obj.visible ? '\u25C9' : '\u25CB');
    eye.title = 'Toggle visibility';
    eye.onclick = function (e) {
      e.stopPropagation();
      obj.visible = !obj.visible;
      def.visible = obj.visible;
      refreshTree();
      refreshUILayer();
    };
    li.appendChild(eye);
    li.onclick = function (e) { e.stopPropagation(); selectObject(obj); };
    li.oncontextmenu = function (e) { e.preventDefault(); if (confirm('Delete ' + def.name + '?')) deleteObject(obj); };
    list.appendChild(li);
    obj.children.forEach(function (c) { if (c.userData && c.userData.def) addNode(c, depth + 1); });
  }
  editorScene.children.forEach(function (c) { if (c.userData && c.userData.def) addNode(c, 0); });
  pane.appendChild(list);
  updateStatusBar();
}

function selectObject(obj) {
  state.selected = obj;
  if (obj) {
    tcontrols.attach(obj);
    axesHelper.position.copy(obj.position);
    buildInspector(obj);
    setStatus('Selected: ' + obj.userData.def.name);
  } else {
    tcontrols.detach();
    buildInspector(null);
    setStatus('Ready');
  }
  refreshTree();
}

function deleteObject(obj) {
  if (!obj) return;
  pushUndo();
  var def = obj.userData.def;
  obj.children.slice().forEach(function (c) {
    if (c.userData && c.userData.def) {
      obj.parent.add(c);
      c.userData.def.parent = def.parent || null;
    }
  });
  if (obj.parent) obj.parent.remove(obj);
  if (state.selected === obj) selectObject(null);
  refreshTree();
  refreshUILayer();
  updateStatusBar();
}

function duplicateObject(obj) {
  if (!obj) return;
  pushUndo();
  var d = deepCopy(obj.userData.def);
  d.id = uid('o');
  d.name = d.name + '_copy';
  d.pos = [obj.position.x + 1, obj.position.y, obj.position.z + 1];
  var parent = obj.parent && obj.parent.userData && obj.parent.userData.def ? obj.parent : editorScene;
  var n = buildEditorObject(d, parent);
  refreshTree();
  selectObject(n);
}

/* =====================================================================
   SECTION 6 - UI LAYER (editor preview)
   ===================================================================== */
function refreshUILayer() {
  var layer = $('#uilayer');
  layer.innerHTML = '';
  if (state.playing) return;
  editorScene.traverse(function (o) {
    if (!o.userData || !o.userData.def) return;
    if (o.userData.def.type.indexOf('ui') !== 0) return;
    var p = o.userData.def.props;
    var n = el('div');
    n.style.position = 'absolute';
    n.style.left = (p.x == null ? 20 : p.x) + 'px';
    n.style.top = (p.y == null ? 20 : p.y) + 'px';
    n.style.width = (p.w || 200) + 'px';
    n.style.height = (p.h || 48) + 'px';
    n.style.borderRadius = (p.radius == null ? 8 : p.radius) + 'px';
    n.style.display = o.visible ? 'block' : 'none';
    var t = o.userData.def.type;
    if (t === 'uitext') {
      n.style.color = p.color || '#fff';
      n.style.fontSize = (p.fontSize || 18) + 'px';
      n.style.fontFamily = p.font || 'Segoe UI, Arial';
      n.style.background = p.bg && p.bg !== 'transparent' ? p.bg : 'transparent';
      n.style.padding = '4px 8px';
      n.textContent = p.text || '';
    } else if (t === 'uiimage') {
      n.style.background = p.bg || 'transparent';
      n.style.backgroundImage = 'url(' + (p.src || '') + ')';
      n.style.backgroundSize = p.fit || 'contain';
      n.style.backgroundRepeat = 'no-repeat';
      n.style.backgroundPosition = 'center';
      n.style.opacity = p.opacity == null ? 1 : p.opacity;
    } else if (t === 'uibutton') {
      n.style.background = p.bg || '#3ea6ff';
      n.style.color = p.color || '#04121f';
      n.style.display = 'flex';
      n.style.alignItems = 'center';
      n.style.justifyContent = 'center';
      n.style.fontWeight = '600';
      n.style.fontSize = (p.fontSize || 16) + 'px';
      n.textContent = p.text || '';
    } else {
      n.style.border = '2px solid ' + (p.color || '#3ea6ff');
      n.style.background = p.bg || 'rgba(10,20,30,.55)';
    }
    n.style.pointerEvents = 'none';
    n.style.outline = state.selected === o ? '1px dashed #3d7ebd' : 'none';
    layer.appendChild(n);
  });
}

   ===================================================================== */
function field(label, value, onchange, type) {
  var row = el('div', 'row');
  row.appendChild(el('label', null, label));
  var inp = el('input');
  inp.type = type || 'text';
  inp.value = value == null ? '' : value;
  if (type === 'number') inp.step = '0.1';
  inp.oninput = function () { onchange(type === 'number' ? parseFloat(inp.value) : inp.value); };
  row.appendChild(inp);
  return row;
}
function selectField(label, value, options, onchange) {
  var row = el('div', 'row');
  row.appendChild(el('label', null, label));
  var s = el('select');
  options.forEach(function (o) {
    var opt = el('option', null, o.label);
    opt.value = o.value;
    if (String(o.value) === String(value)) opt.selected = true;
    s.appendChild(opt);
  });
  s.onchange = function () { onchange(s.value); };
  row.appendChild(s);
  return row;
}
function checkField(label, value, onchange) {
  var row = el('div', 'row');
  row.appendChild(el('label', null, label));
  var c = el('input');
  c.type = 'checkbox';

function bindSectionCollapse(root) {

}

function section(title) {

  var inner = el('div', 'inner');
  s.appendChild(inner);
  s.appendChild = function (child) { inner.appendChild(child); return s; };
  return s;
}
function applyMaterial(obj, props) {

    if (n.isMesh && !n.userData.helper) n.material = makeMaterialForEditor(props);
  });
}
function rebuildObject(obj) {

  var parent = obj.parent;
  var wasSelected = state.selected === obj;
  var newObj = buildEditorObject(def, parent === editorScene ? null : parent);
  parent.remove(obj);
  def.pos = newObj.position.toArray();
  if (wasSelected) selectObject(newObj);
  refreshTree();
  refreshUILayer();
}
function playEditorClip(obj, name) {
  var anims = obj.userData.animations || [];

  var root = obj.userData.loadedModel;
  if (!root) return;
  if (!obj.userData.mixer) obj.userData.mixer = new THREE.AnimationMixer(root);
  var clip = anims.find(function (c) { return c.name === name; }) || anims[0];
  obj.userData.mixer.stopAllAction();
  obj.userData.mixer.clipAction(clip).reset().play();
}

  var vals = [o.position.toArray(), [o.rotation.x, o.rotation.y, o.rotation.z], o.scale.toArray()];
  inspectorTransformRows.forEach(function (row, i) {
    var inputs = row.querySelectorAll('input');

  });

  editorScene.traverse(function (o) { if (o.userData && o.userData.def) out.push(o.userData.def); });
  return out;
}
function findObjectById(id) {
  var found = null;
  editorScene.traverse(function (o) { if (o.userData && o.userData.def && o.userData.def.id === id) found = o; });
  return found;
}

function buildToolbox() {

  function renderModels(q) {
    results.innerHTML = '';

      .forEach(function (s) {

function addDef(def) {
  pushUndo();
  var parent = null;

function generateObjectCode(def) {
  var lines = [];
  lines.push('// KEngine1 generated script for "' + def.name + '" (' + def.type + ')');
  lines.push('// Available: me (this object), K (engine API), THREE');
  lines.push('');
  (def.rules || []).forEach(function (r, i) {
    lines.push('// --- Rule ' + (i + 1) + ' ---');
    if (r.when === 'tick') {
      lines.push('K.on("tick", function (dt) {');
      lines.push('  ' + ruleToCode(def, r, 'me'));
      lines.push('});');
    } else if (r.when === 'key') {
      lines.push('K.on("key", function (d) {');
      lines.push('  if (d.code === "' + (r.key || 'Space') + '") {');
      lines.push('    ' + ruleToCode(def, r, 'me'));
      lines.push('  }');
      lines.push('});');
    } else {
      lines.push('me.on("' + r.when + '", function (data) {');
      lines.push('  ' + ruleToCode(def, r, 'me'));
      lines.push('});');
    }
    lines.push('');
  });
  if (def.script && def.script.trim()) {
    lines.push('// --- Custom script ---');
    lines.push(def.script);
  }
  return lines.join('\n');
}

function ruleToCode(def, r, self) {
  var a = r.args || {};
  var n = function (k, d) { return a[k] == null || a[k] === '' ? d : a[k]; };
  var tgt = a.target ? 'K.find("' + a.target + '")' : self;
  switch (r.do) {
    case 'moveBy': return self + '.move(' + n('x', 0) + ', ' + n('y', 0) + ', ' + n('z', 0) + ');';
    case 'setPos': return self + '.setPosition(' + n('x', 0) + ', ' + n('y', 0) + ', ' + n('z', 0) + ');';
    case 'rotateBy': return self + '.rotate(' + n('x', 0) + ', ' + n('y', 0) + ', ' + n('z', 0) + ');';
    case 'setColor': return self + '.setColor("' + n('value', '#ffffff') + '");';
    case 'setVisible': return self + '.setVisible(' + (String(n('value', 'false')) === 'true') + ');';
    case 'toggleVisible': return self + '.setVisible(!' + self + '.object.visible);';
    case 'setText': return self + '.setText("' + n('value', '') + '");';
    case 'playSound': return 'K.sound({ synth: "' + n('value', 'beep') + '", volume: ' + n('volume', 0.6) + ' });';
    case 'playAnim': return self + '.playAnimation("' + n('value', '') + '");';
    case 'spawn': return 'K.spawn(JSON.parse(JSON.stringify(' + self + '.def)));';
    case 'clone': return self + '.clone();';
    case 'destroy': return 'K.destroy(' + tgt + ');';
    case 'setVar': return 'K.setVar("' + n('name', 'score') + '", ' + (isNaN(parseFloat(n('value', 0))) ? '"' + n('value', '') + '"' : n('value', 0)) + ');';
    case 'addVar': return 'K.setVar("' + n('name', 'score') + '", (K.getVar("' + n('name', 'score') + '") || 0) + ' + n('value', 1) + ');';
    case 'completeMission': return 'K.completeMission("' + n('value', def.name) + '");';
    case 'resetMissions': return 'K.resetMissions();';
    case 'saveGame': return 'K.saveGame();';
    case 'loadGame': return 'K.loadGame();';
    case 'deleteSave': return 'K.deleteSave();';
    case 'teleport': return self + '.object.position.copy(' + tgt + '.object.position);';
    case 'attach': return tgt + '.object.attach(' + self + '.object);';
    case 'lookAt': return self + '.object.lookAt(' + tgt + '.object.position);';
    case 'showUI': return 'me.setVisible(true);';
    case 'hideUI': return 'me.setVisible(false);';
    case 'playCutscene': return 'K.playCutscene("' + n('value', '') + '");';
    case 'openURL': return 'window.open("' + n('value', '') + '", "_blank");';
    case 'sendNet': return 'K.sendNet("' + n('value', '') + '");';
    case 'emit': return 'K.emit("' + n('value', 'event') + '");';
    case 'print': return 'K.log("' + n('value', '') + '");';
    default: return '// ' + r.do;
  }
}

function buildCutscenePanel() {
  var pane = $('#pane-cutscene');

  var addBtn = el('button', 'primary', 'New Cutscene');

  };

  if (!state.cutscenes.length) {

  }
  var sel = el('select');

  sel.onchange = function () { csSelected = parseInt(sel.value); buildCutscenePanel(); };
  s.appendChild(sel);
  var cs = state.cutscenes[csSelected];
  s.appendChild(field('Name', cs.name, function (v) { cs.name = v; sel.options[csSelected].text = v; }));
  s.appendChild(field('Duration (s)', cs.duration, function (v) { cs.duration = v; }, 'number'));
  s.appendChild(field('Camera object name', cs.cameraId || '', function (v) { cs.cameraId = v; }));
  var delBtn = el('button', 'bad', 'Delete Cutscene');
  delBtn.onclick = function () { state.cutscenes.splice(csSelected, 1); csSelected = 0; buildCutscenePanel(); };
  s.appendChild(delBtn);
  pane.appendChild(s);

  var s2 = section('Keyframes');
  var tRow = el('div', 'row');
  var tInput = el('input');
  tInput.type = 'number'; tInput.step = '0.1'; tInput.value = '0';
  var addKeyBtn = el('button', 'primary', 'Add Key at Time');
  addKeyBtn.onclick = function () {
    if (!state.selected) { alert('Select an object in the scene first.'); return; }
    var def = state.selected.userData.def;
    var t = parseFloat(tInput.value) || 0;
    var track = cs.tracks.find(function (x) { return x.id === def.id; });
    if (!track) { track = { id: def.id, name: def.name, keys: [] }; cs.tracks.push(track); }
    track.keys = track.keys.filter(function (k) { return Math.abs(k.t - t) > 0.001; });
    track.keys.push({ t: t, p: state.selected.position.toArray(), r: [state.selected.rotation.x, state.selected.rotation.y, state.selected.rotation.z] });
    track.keys.sort(function (a, b) { return a.t - b.t; });
    buildCutscenePanel();
  };
  tRow.appendChild(tInput); tRow.appendChild(addKeyBtn);
  s2.appendChild(tRow);
  cs.tracks.forEach(function (track, ti) {
    var box = el('div', 'rule');
    box.appendChild(el('b', null, track.name + '  (' + track.keys.length + ' keys)'));
    track.keys.forEach(function (k, ki) {
      var row = el('div', 'row');
      row.appendChild(el('label', null, k.t.toFixed(2) + 's'));
      var rm = el('button', 'bad', 'x');
      rm.style.width = '26px';
      rm.onclick = function () { track.keys.splice(ki, 1); buildCutscenePanel(); };
      row.appendChild(rm);
      box.appendChild(row);
    });
    var rmTrack = el('button', 'bad', 'Remove Track');

    box.appendChild(rmTrack);

    state.settings.autoCutscene = cs.name;
    startPlay();
  };

  pane.appendChild(s2);

  bindSectionCollapse(pane);
}
