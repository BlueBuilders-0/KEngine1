function applyWorldSettings() {
  var s = state.settings;
  editorScene.background = new THREE.Color(s.bg);
  if (s.fog.enabled) editorScene.fog = new THREE.Fog(new THREE.Color(s.fog.color), s.fog.near, s.fog.far);
  else editorScene.fog = null;
  var old = editorScene.getObjectByName('__sky');
  if (old) editorScene.remove(old);
  if (s.skybox.type === 'procedural') {
    var sky = new Sky();
    sky.name = '__sky';
    sky.scale.setScalar(10000);
    var u = sky.material.uniforms;
    u.turbidity.value = s.skybox.turbidity;
    u.rayleigh.value = s.skybox.rayleigh;
    u.mieCoefficient.value = 0.005;
    u.mieDirectionalG.value = 0.8;
    var sun = new THREE.Vector3();
    var phi = THREE.MathUtils.degToRad(90 - s.skybox.elevation);
    var theta = THREE.MathUtils.degToRad(s.skybox.azimuth);
    sun.setFromSphericalCoords(1, phi, theta);
    u.sunPosition.value.copy(sun);
    editorScene.add(sky);
    editorDir.position.copy(sun).multiplyScalar(50);
  } else if (s.skybox.type === 'hdr' && s.skybox.url) {
    var rgbe = new RGBELoader();
    rgbe.setCrossOrigin('anonymous');
    rgbe.load(s.skybox.url, function (tex) {
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.name = '__sky';
      editorScene.background = tex;
      editorScene.environment = tex;
    }, undefined, function () {});
  }
}

function ensurePeerJS(cb) {
  if (typeof window.Peer !== 'undefined') { cb(); return; }
  var sc = document.createElement('script');
  sc.src = 'https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js';
  sc.onload = cb;
  sc.onerror = function () { alert('Could not load the PeerJS networking library.'); };
  document.head.appendChild(sc);
}

/* =====================================================================
   SECTION 14 - PLAY MODE
   ===================================================================== */
function startPlay() {
  if (state.playing) return;
  var project = serializeProject();
  state.playing = true;

  var rt = KRuntime(THREE, CANNON, {
    GLTFLoader: GLTFLoader,
    RGBELoader: RGBELoader,
    Sky: Sky,
    EffectComposer: EffectComposer,
    RenderPass: RenderPass,
    UnrealBloomPass: UnrealBloomPass
  }, {});

  var layer = $('#uilayer');
  rt.load(project, layer);
  rt.attachRenderer(renderer, canvas.clientWidth, canvas.clientHeight);
  rt.bindInput(renderer.domElement, canvas);
  rt.camera.aspect = canvas.clientWidth / Math.max(1, canvas.clientHeight);
  rt.camera.updateProjectionMatrix();
  state.runtime = rt;
  rt.start();

  tcontrols.detach();
  orbit.enabled = false;
  gridHelper.visible = false;
  axesHelper.visible = false;

  $$('#hud button').forEach(function (b) { b.disabled = true; });
  $('[data-act="stop"]').disabled = false;
  $('[data-act="play"]').disabled = true;
  setStatus('Playing');
}

function stopPlay() {
  if (!state.playing) return;
  state.playing = false;
  if (state.runtime) { state.runtime.dispose(); state.runtime = null; }
  $('#uilayer').innerHTML = '';
  orbit.enabled = true;
  gridHelper.visible = state.grid;
  $$('#hud button').forEach(function (b) { b.disabled = false; });
  $('[data-act="stop"]').disabled = true;
  $('[data-act="play"]').disabled = false;
  if (document.exitPointerLock) document.exitPointerLock();
  refreshUILayer();
  if (state.selected) selectObject(state.selected);
  setStatus('Ready');
}

   ===================================================================== */
const DB = {
  open: function () {
    return new Promise(function (res, rej) {
      var rq = indexedDB.open('kengine1', 1);
      rq.onupgradeneeded = function () {
        var db = rq.result;
        if (!db.objectStoreNames.contains('projects')) db.createObjectStore('projects', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'k' });
      };
      rq.onsuccess = function () { res(rq.result); };
      rq.onerror = function () { rej(rq.error); };
    });
  },
  put: function (rec) {
    return DB.open().then(function (db) {
      return new Promise(function (res) {
        var tx = db.transaction('projects', 'readwrite');
        tx.objectStore('projects').put(rec);
        tx.oncomplete = function () { res(rec); };
      });
    });
  },
  all: function () {
    return DB.open().then(function (db) {
      return new Promise(function (res) {
        var tx = db.transaction('projects', 'readonly');
        var rq = tx.objectStore('projects').getAll();
        rq.onsuccess = function () { res(rq.result || []); };
      });
    });
  },
  get: function (id) {
    return DB.open().then(function (db) {
      return new Promise(function (res) {
        var tx = db.transaction('projects', 'readonly');
        var rq = tx.objectStore('projects').get(id);
        rq.onsuccess = function () { res(rq.result); };
      });
    });
  },
  del: function (id) {
    return DB.open().then(function (db) {
      return new Promise(function (res) {
        var tx = db.transaction('projects', 'readwrite');
        tx.objectStore('projects').delete(id);
        tx.oncomplete = res;
      });
    });
  },
  meta: function (k, v) {
    if (v === undefined) {
      return DB.open().then(function (db) {
        return new Promise(function (res) {
          var tx = db.transaction('meta', 'readonly');
          var rq = tx.objectStore('meta').get(k);
          rq.onsuccess = function () { res(rq.result ? rq.result.v : null); };
        });
      });
    }
    return DB.open().then(function (db) {
      return new Promise(function (res) {
        var tx = db.transaction('meta', 'readwrite');
        tx.objectStore('meta').put({ k: k, v: v });
        tx.oncomplete = res;
      });
    });
  }
};

function cloudConfig() {
  try { return JSON.parse(localStorage.getItem('kengine1.cloud') || 'null') || { url: '', key: '' }; }
  catch (e) { return { url: '', key: '' }; }
}
function setCloudConfig(c) { localStorage.setItem('kengine1.cloud', JSON.stringify(c)); }

function saveProject(silent) {
  var data = serializeProject();
  var rec = { id: state.projectId || uid('proj'), name: data.name, updated: data.updated, data: data };
  state.projectId = rec.id;
  DB.put(rec).then(function () {
    DB.meta('last', rec.id);
    if (!silent) setStatus('Project saved');
    var cfg = cloudConfig();
    if (cfg.url) {
      fetch(cfg.url.replace(/\/$/, '') + '/projects/' + rec.id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Api-Key': cfg.key || '' },
        body: JSON.stringify(rec)
      }).catch(function () {});
    }
  });
}

function loadProjectById(id) {
  return DB.get(id).then(function (rec) {
    if (!rec) return false;
    state.projectId = rec.id;
    applyProject(rec.data);
    return true;
  });
}

function renderProjectList() {
  var box = $('#projectList');
  box.innerHTML = '';
  DB.all().then(function (list) {
    list.sort(function (a, b) { return (b.updated || 0) - (a.updated || 0); });
    if (!list.length) { box.appendChild(el('p', 'hint', 'No saved projects yet.')); return; }
    list.forEach(function (rec) {
      var row = el('div', 'proj');
      var nm = el('div', 'nm');
      nm.appendChild(el('span', null, rec.name));
      var dt = new Date(rec.updated || Date.now());
      nm.appendChild(el('small', null, dt.toLocaleString() + '  |  ' + ((rec.data.objects || []).length) + ' objects'));
      nm.onclick = function () { loadProjectById(rec.id).then(function () { showEditor(); }); };
      row.appendChild(nm);
      var ex = el('button', null, 'Export');
      ex.onclick = function (e) {
        e.stopPropagation();
        var blob = new Blob([JSON.stringify(rec.data, null, 2)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = rec.name.replace(/\s+/g, '_') + '.keng';
        a.click();
      };
      var rm = el('button', 'bad', 'Delete');
      rm.onclick = function (e) {
        e.stopPropagation();
        if (confirm('Delete project "' + rec.name + '"?')) DB.del(rec.id).then(renderProjectList);
      };
      row.appendChild(ex); row.appendChild(rm);
      box.appendChild(row);
    });
  });
}

/* =====================================================================
   SECTION 17 - UNDO / REDO
   ===================================================================== */
function pushUndo() {
  if (state.undoLock) return;
  state.undoStack.push(JSON.stringify(serializeProject()));
  if (state.undoStack.length > 40) state.undoStack.shift();
  state.redoStack = [];
}
let undoTimer = null;
function scheduleUndo() {
  if (undoTimer) return;
  undoTimer = setTimeout(function () { undoTimer = null; pushUndo(); }, 700);
}
function undo() {
  if (!state.undoStack.length) return;
  state.undoLock = true;
  state.redoStack.push(JSON.stringify(serializeProject()));
  applyProject(JSON.parse(state.undoStack.pop()));
  state.undoLock = false;
}
function redo() {
  if (!state.redoStack.length) return;
  state.undoLock = true;
  state.undoStack.push(JSON.stringify(serializeProject()));
  applyProject(JSON.parse(state.redoStack.pop()));
  state.undoLock = false;
}

$$('#hud button').forEach(function (b) {
  b.onclick = function () {
    var t = b.dataset.tool;
    if (t === 'translate' || t === 'rotate' || t === 'scale') {
      tcontrols.setMode(t);
      b.style.borderColor = '#4a90d9';
      $$('#hud button').forEach(function (x) {
        if (['translate', 'rotate', 'scale'].indexOf(x.dataset.tool) >= 0 && x !== b) x.style.borderColor = '';
      });
    } else if (t === 'none') { tcontrols.setMode('translate'); selectObject(null); }
    else if (t === 'snap') {
      state.snap = !state.snap;
      tcontrols.setTranslationSnap(state.snap ? 0.5 : null);
      tcontrols.setRotationSnap(state.snap ? Math.PI / 12 : null);
      tcontrols.setScaleSnap(state.snap ? 0.25 : null);
      b.textContent = 'Snap: ' + (state.snap ? 'on' : 'off');
    } else if (t === 'grid') {
      state.grid = !state.grid;
      gridHelper.visible = state.grid;
      b.textContent = 'Grid: ' + (state.grid ? 'on' : 'off');
    } else if (t === 'focus') {
      if (state.selected) {
        var p = new THREE.Vector3();
        state.selected.getWorldPosition(p);
        orbit.target.copy(p);
      }
    } else if (t === 'del') { if (state.selected) deleteObject(state.selected); }
    else if (t === 'dup') { if (state.selected) duplicateObject(state.selected); }
    else if (t === 'third') {
      if (state.runtime && state.runtime.player) {
        state.runtime.player.thirdPerson = !state.runtime.player.thirdPerson;
        state.runtime.player.cam.initialized = false;
        b.textContent = state.runtime.player.thirdPerson ? '3rd Person' : '1st Person';
      } else {
        state.settings.player.thirdPerson = !state.settings.player.thirdPerson;
        b.textContent = state.settings.player.thirdPerson ? '3rd Person' : '1st Person';
        buildWorldPanel();
      }
    } else if (t === 'camreset') {
      if (state.runtime && state.runtime.player) {
        var pl = state.runtime.player;
        pl.cam.yaw = pl.obj ? pl.obj.rotation.y : 0;
        pl.cam.pitch = 0.22;
        pl.cam.initialized = false;
      }
    }
  };
});

let pointerDownPos = null;
renderer.domElement.addEventListener('pointerdown', function (e) { pointerDownPos = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', function (e) {
  if (state.playing) return;
  if (!pointerDownPos) return;
  var moved = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
  pointerDownPos = null;
  if (moved > 4) return;
  if (tcontrols.dragging) return;
  var rect = renderer.domElement.getBoundingClientRect();
  var mouse = {
    x: ((e.clientX - rect.left) / rect.width) * 2 - 1,
    y: -((e.clientY - rect.top) / rect.height) * 2 + 1
  };
  var ray = new THREE.Raycaster();
  ray.setFromCamera(mouse, editorCam);
  var hits = ray.intersectObjects(editorScene.children, true);
  var found = null;
  for (var i = 0; i < hits.length; i++) {
    var n = hits[i].object;
    if (n.userData && n.userData.helper) continue;
    while (n && !(n.userData && n.userData.def)) n = n.parent;
    if (n) { found = n; break; }
  }
  selectObject(found);
});

window.addEventListener('keydown', function (e) {
  if (state.playing) return;
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (e.ctrlKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  else if (e.ctrlKey && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if (e.ctrlKey && e.key.toLowerCase() === 's') { e.preventDefault(); saveProject(false); }
  else if (e.key === 'Delete' && state.selected) deleteObject(state.selected);
  else if (e.key.toLowerCase() === 'w') tcontrols.setMode('translate');
  else if (e.key.toLowerCase() === 'e') tcontrols.setMode('rotate');
  else if (e.key.toLowerCase() === 'r') tcontrols.setMode('scale');
  else if (e.key === 'f' && state.selected) {
    var p = new THREE.Vector3();
    state.selected.getWorldPosition(p);
    orbit.target.copy(p);
  }
});

/* =====================================================================
   SECTION 19 - MAIN LOOP
   ===================================================================== */
let lastTime = performance.now();
let fpsAccum = 0, fpsFrames = 0, fpsValue = 0;
function loop(now) {
  requestAnimationFrame(loop);
  var dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  fpsAccum += dt; fpsFrames++;
  if (fpsAccum > 0.5) {
    fpsValue = Math.round(fpsFrames / fpsAccum);
    fpsAccum = 0; fpsFrames = 0;
    $('#stats').textContent = fpsValue + ' fps';
    $('#statusFps').textContent = fpsValue + ' fps';
  }
  if (state.playing && state.runtime) {
    state.runtime.update(dt);
    state.runtime.render(renderer, canvas.clientWidth, canvas.clientHeight);
  } else {
    orbit.update();
    editorScene.traverse(function (o) { if (o.userData && o.userData.mixer) o.userData.mixer.update(dt); });
    renderer.render(editorScene, editorCam);
  }
}

/* =====================================================================
   SECTION 21 - RESIZABLE PANEL LAYOUT
   ===================================================================== */
(function setupLayout() {
  var LS_KEY = 'kengine1.editor.layout';
  var defaults = { left: 260, right: 320, hudX: 6, hudY: 6 };
  var layout = Object.assign({}, defaults);
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) layout = Object.assign(layout, JSON.parse(raw));
  } catch (e) {}

  var leftEl = $('#left');
  var rightEl = $('#right');
  var bodyEl = $('#body');
  var hudEl = $('#hud');
  var vpEl = $('#viewport');

  function saveLayout() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(layout)); } catch (e) {}
  }

  function applyLayout() {
    leftEl.style.width = layout.left + 'px';
    leftEl.style.flexBasis = layout.left + 'px';
    rightEl.style.width = layout.right + 'px';
    rightEl.style.flexBasis = layout.right + 'px';
    if (hudEl) {
      hudEl.style.left = layout.hudX + 'px';
      hudEl.style.top = layout.hudY + 'px';
    }
    if (typeof resize === 'function') setTimeout(resize, 0);
  }

  var MIN_LEFT = 0, MAX_LEFT = 560;
  var MIN_RIGHT = 0, MAX_RIGHT = 640;
  var MIN_CENTER = 220;

  function startDrag(side, startX) {
    var startLeft = layout.left;
    var startRight = layout.right;

    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';

    function onMove(e) {
      var dx = e.clientX - startX;
      var bodyW = bodyEl.clientWidth;
      if (side === 'left') {
        var w = Math.max(MIN_LEFT, Math.min(MAX_LEFT, startLeft + dx));
        if (bodyW - w - layout.right < MIN_CENTER) {
          w = Math.max(MIN_LEFT, bodyW - layout.right - MIN_CENTER);
        }
        layout.left = Math.round(w);
      } else {
        var w2 = Math.max(MIN_RIGHT, Math.min(MAX_RIGHT, startRight - dx));
        if (bodyW - w2 - layout.left < MIN_CENTER) {
          w2 = Math.max(MIN_RIGHT, bodyW - layout.left - MIN_CENTER);
        }
        layout.right = Math.round(w2);
      }
      applyLayout();
    }

    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      $$('.splitter').forEach(function (s) { s.classList.remove('dragging'); });
      saveLayout();
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  $$('.splitter').forEach(function (sp) {
    sp.addEventListener('mousedown', function (e) {
      e.preventDefault();
      sp.classList.add('dragging');
      startDrag(sp.dataset.split, e.clientX);
    });
    sp.addEventListener('dblclick', function () {
      layout[sp.dataset.split] = defaults[sp.dataset.split];
      applyLayout();
      saveLayout();
    });
  });

  if (hudEl) {
    var hudDrag = null;
    hudEl.addEventListener('mousedown', function (e) {
      if (e.target.tagName === 'BUTTON') return;
      e.preventDefault();
      hudDrag = {
        startX: e.clientX, startY: e.clientY,
        origX: layout.hudX, origY: layout.hudY
      };
      hudEl.classList.add('dragging');
      document.body.style.userSelect = 'none';
    });
    document.addEventListener('mousemove', function (e) {
      if (!hudDrag) return;
      var vpW = vpEl.clientWidth;
      var vpH = vpEl.clientHeight;
      var w = hudEl.offsetWidth || 40;
      var h = hudEl.offsetHeight || 20;
      var nx = hudDrag.origX + (e.clientX - hudDrag.startX);
      var ny = hudDrag.origY + (e.clientY - hudDrag.startY);
      nx = Math.max(0, Math.min(vpW - w, nx));
      ny = Math.max(0, Math.min(vpH - h, ny));
      layout.hudX = Math.round(nx);
      layout.hudY = Math.round(ny);
      hudEl.style.left = layout.hudX + 'px';
      hudEl.style.top = layout.hudY + 'px';
    });
    document.addEventListener('mouseup', function () {
      if (!hudDrag) return;
      hudDrag = null;
      hudEl.classList.remove('dragging');
      document.body.style.userSelect = '';
      saveLayout();
    });
  }

  window.addEventListener('resize', function () {
    var bodyW = bodyEl.clientWidth;
    if (bodyW - layout.left - layout.right < MIN_CENTER) {
      var available = Math.max(MIN_LEFT, bodyW - layout.right - MIN_CENTER);
      layout.left = Math.min(layout.left, available);
      applyLayout();
    }
  });

  applyLayout();
})();
